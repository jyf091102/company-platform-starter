<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户资料</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Example Company</a><nav><a href="portal.html">业务概览</a><a href="customer-profile.html">客户资料</a></nav></header><section class="page-head"><p class="eyebrow">Customer profile</p><h1>完善客户资料</h1><p>用于了解企业背景、服务需求和沟通偏好，不进行金融 KYC 或身份尽调。</p></section><main class="content"><div class="notice">请只提交开展业务所需的信息。不要填写密码、证件号码、银行卡信息或其他不必要的敏感资料。</div><form id="profileForm"><div class="form-grid"><div class="field"><label>联系人姓名<input name="contact_name" maxlength="100" required></label></div><div class="field"><label>工作邮箱<input name="work_email" type="email" maxlength="254" required></label></div><div class="field"><label>企业名称<input name="company_name" maxlength="160" required></label></div><div class="field"><label>所在地区<input name="region" maxlength="100"></label></div><div class="field"><label>行业<select name="industry"><option>专业服务</option><option>零售与电商</option><option>制造与供应链</option><option>科技与软件</option><option>文化与创意</option><option>其他</option></select></label></div><div class="field"><label>团队规模<select name="company_size"><option>1–9 人</option><option>10–49 人</option><option>50–249 人</option><option>250 人以上</option></select></label></div><div class="field full"><label>关注的服务<textarea name="service_needs" maxlength="1200" placeholder="例如：网站建设、品牌设计、系统维护、业务咨询"></textarea></label></div><div class="field"><label>首选联系方式<select name="preferred_contact"><option value="email">电子邮件</option><option value="phone">电话</option><option value="portal">门户消息</option></select></label></div><div class="field"><label>期望联系时间<input name="preferred_time" maxlength="80" placeholder="例如：工作日上午"></label></div></div><div class="actions"><button>保存资料</button><span class="status"></span></div></form></main><script type="module" src="customer-profile.js"></script></body></html>

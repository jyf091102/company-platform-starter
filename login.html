<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录与注册</title><link rel="stylesheet" href="styles.css"></head><body><header class="nav"><a class="brand" href="index.html">Example Company</a></header><section class="page-head"><p class="eyebrow">Account</p><h1>登录与注册</h1><p>通用邮箱账户入口；生产环境应配置邮件确认、MFA、速率限制和异常登录告警。</p></section><main class="content"><div class="tabs"><button data-tab="login" class="active">登录</button><button data-tab="register">注册</button></div><form id="loginForm"><h2>登录</h2><div class="form-grid"><div class="field full"><label>邮箱<input name="email" type="email" autocomplete="email" required></label></div><div class="field full"><label>密码<input name="password" type="password" autocomplete="current-password" minlength="8" required></label></div></div><div class="actions"><button>登录</button><span class="status"></span></div></form><form id="registerForm" hidden><h2>创建账户</h2><div class="form-grid"><div class="field"><label>联系人姓名<input name="displayName" maxlength="100" required></label></div><div class="field"><label>邮箱<input name="email" type="email" autocomplete="email" required></label></div><div class="field full"><label>密码<input name="password" type="password" autocomplete="new-password" minlength="10" required></label></div></div><div class="actions"><button>注册</button><span class="status"></span></div></form></main><script type="module" src="login.js"></script></body></html>
